[package]
name = "olorin_tui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "olorin_tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"

[profile.release]
opt-level = 3
